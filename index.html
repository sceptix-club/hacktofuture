<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="manifest" href="/manifest.json" />

  <!-- DNS + connection optimization -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- NON-blocking font load -->
  <link
    rel="preload"
    href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&family=Dela+Gothic+One&display=swap"
    as="style"
    onload="this.onload=null;this.rel='stylesheet'"
  >
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&family=Dela+Gothic+One&display=swap"
      rel="stylesheet"
    />
  </noscript>

  <!-- CSS async -->
  <link
    rel="preload"
    href="/assets/index.css"
    as="style"
    onload="this.onload=null;this.rel='stylesheet'"
  >
  <noscript>
    <link rel="stylesheet" href="/assets/index.css">
  </noscript>

  <!-- Only preload truly critical visual asset -->
  <link rel="preload" href="/textures/background.jpg" as="image">

  <!-- Remove GLB preload (lazy load in JS instead) -->

  <title>HackToFuture 4.0</title>
</head>

  <body>
    <!-- Instant black screen before React mounts — prevents any content flash -->
    <div
      id="pre-loader"
      style="
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: #000;
        transition: opacity 0.3s ease;
      "
    >
      <!-- Force font render during loading so it's ready when loader fades -->
      <span
        style="
          position: absolute;
          opacity: 0;
          font-family: 'Dela Gothic One';
          font-size: 1px;
          pointer-events: none;
        "
        >.</span
      >
      <span
        style="
          position: absolute;
          opacity: 0;
          font-family: 'Comic Relief';
          font-size: 1px;
          pointer-events: none;
        "
        >.</span
      >
    </div>
    <div id="root"></div>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-26PQ42Z45J"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-26PQ42Z45J", {
        send_page_view: false,
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
